<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brand Gallery</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#f8f8f8;padding:24px;max-width:1200px;margin:0 auto}
.back{display:inline-block;margin-bottom:24px;padding:10px 18px;background:#222;color:#fff;border-radius:8px;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.item img{width:100%;border-radius:8px;cursor:pointer}
.item img:hover{opacity:0.85}
.tip{color:blue;font-size:14px;margin-bottom:16px;white-space:pre-wrap}
</style>
</head>
<body>
<a class="back" href="index.html">← Back to Brand List</a>
<div class="tip" id="tip"></div>
<div class="grid" id="imgBox"></div>
<script>
// ✅修复：去掉了 /yjia-img/
const baseUrl = "https://img.yjia.shop/";
const dir = new URLSearchParams(location.search).get("dir");
const tipDom = document.getElementById("tip");
const box = document.getElementById("imgBox");

const fileMap = {
"dior":["d1.jpg"],
"chanel":["c1.jpg","c2.jpg"],
"lv":["lv1.jpg","lv2.jpg"]
};

if(!dir){
  tipDom.innerText = "错误：没有dir参数";
}else if(!fileMap[dir]){
  tipDom.innerText = `错误：没有这个分类：${dir}`
}else{
  const imgList = fileMap[dir];
  let logText = "dir=" + dir + "\n";
  imgList.forEach(filename=>{
    const fullSrc = baseUrl + dir + "/" + filename;
    logText += "图片地址："+fullSrc+"\n";

    const wrap = document.createElement("div");
    wrap.className="item";
    const aTag = document.createElement("a");
    aTag.href=fullSrc;
    aTag.target="_blank";
    const img = document.createElement("img");
    img.src=fullSrc;
    img.alt=filename;
    aTag.appendChild(img);
    wrap.appendChild(aTag);
    box.appendChild(wrap);
  })
  tipDom.innerText = logText;
}
</script>
</body>
</html>
