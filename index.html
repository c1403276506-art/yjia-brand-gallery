<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YJIA Brand Catalog</title>
<link rel="preconnect" href="https://gallery.yjia.shop">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
body{
  min-height:100vh;
  padding:40px 16px 120px;
  color:#fff;
  position:relative;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.08), transparent 45%),
    radial-gradient(circle at 80% 10%, rgba(212, 175, 55, 0.12), transparent 50%),
    radial-gradient(circle at 50% 90%, rgba(255, 255, 255, 0.05), transparent 40%),
    linear-gradient(135deg, #1a1a1a 0%, #2b2419 35%, #141414 100%);
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 15% 25%, rgba(255,255,255,0.06) 1px, transparent 1.5px),
    radial-gradient(circle at 85% 35%, rgba(212,175,55,0.05) 1px, transparent 1.5px),
    radial-gradient(circle at 45% 80%, rgba(255,255,255,0.04) 1px, transparent 1.5px);
  background-size:120px 120px, 180px 180px, 160px 160px;
  pointer-events:none;
  z-index:0;
}
.container{
  max-width:1200px;
  margin:0 auto;
  position:relative;
  z-index:1;
}
.page-header{
  text-align:center;
  margin-bottom:32px;
}
.page-header h1{
  font-size:32px;
  letter-spacing:4px;
  color:#f5f5f5;
  margin-bottom:14px;
  font-weight:500;
}
.desc-text{
  color:#b8b8b8;
  font-size:15px;
  letter-spacing:0.5px;
  line-height:1.6;
}
/* 搜索框 */
.search-box-wrap{
  margin-bottom:36px;
  text-align:center;
}
#searchInput{
  width:min(100%, 460px);
  padding:14px 20px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(212,175,55,0.3);
  border-radius:999px;
  color:#fff;
  font-size:15px;
  outline:none;
  transition:0.3s;
}
#searchInput::placeholder{
  color:#999;
}
#searchInput:focus{
  border-color:rgba(212,175,55,0.7);
  background:rgba(255,255,255,0.09);
}
.brand-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
  gap:26px;
}
.brand-card{
  background:linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
  border:1px solid rgba(255,255,255,0.12);
  border-radius:18px;
  overflow:hidden;
  transition:0.35s ease;
  text-decoration:none;
  color:#fff;
  display:block;
}
.brand-card:hover{
  transform:translateY(-8px);
  border-color:rgba(212,175,55,0.48);
  box-shadow:0 20px 40px rgba(0,0,0,0.45);
}
.card-img-wrap{
  height:200px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(255,255,255,0.04);
}
.card-img-wrap img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}
.card-name{
  text-align:center;
  padding:14px 10px;
  font-size:15px;
  letter-spacing:1px;
  color:#ddd;
}
/* WhatsApp悬浮按钮 */
.wa-float{
  position:fixed;
  right:24px;
  bottom:24px;
  width:60px;
  height:60px;
  border-radius:50%;
  background:#25D366;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:28px;
  text-decoration:none;
  z-index:99;
  box-shadow:0 6px 18px rgba(0,0,0,0.4);
  transition:0.25s;
}
.wa-float:hover{
  background:#1fbb59;
  transform:scale(1.08);
}
footer{
  margin-top:60px;
  text-align:center;
  color:#888;
  font-size:13px;
}
@media(max-width:768px){
  .page-header h1{
    font-size:24px;
  }
  .brand-grid{
    grid-template-columns:repeat(auto-fill, minmax(145px, 1fr));
    gap:16px;
  }
  .card-img-wrap{
    height:145px;
  }
  .wa-float{
    width:52px;
    height:52px;
    font-size:24px;
    right:16px;
    bottom:16px;
  }
}
</style>
</head>
<body>
<div class="container">
  <div class="page-header">
    <h1>YJIA BRAND CATALOG</h1>
    <p class="desc-text">Our Brand Catalog, click brand to view product pictures, contact us via WhatsApp for inquiry.</p>
  </div>

  <div class="search-box-wrap">
    <input id="searchInput" placeholder="Search brand name..." />
  </div>

  <div class="brand-grid" id="brandGrid">
    <!-- ========== ALL ITEMS 入口 ========== -->
    <a class="brand-card" href="https://gallery.yjia.shop?brand=" target="_blank" data-name="All Items">
      <div class="card-img-wrap">
        <img src="https://img.yjia.shop/all-logo.png" loading="lazy" alt="All Items">
      </div>
      <div class="card-name">All Items</div>
    </a>

    <!-- ========== 你的品牌卡片在这里，继续往下新增 ========== -->
    <a class="brand-card" href="https://gallery.yjia.shop?brand=DIOR" target="_blank" data-name="DIOR">
      <div class="card-img-wrap">
        <img src="https://img.yjia.shop/DIOR-logo.png" loading="lazy" alt="DIOR">
      </div>
      <div class="card-name">DIOR</div>
    </a>
    <a class="brand-card" href="https://gallery.yjia.shop?brand=CHANEL" target="_blank" data-name="CHANEL">
      <div class="card-img-wrap">
        <img src="https://img.yjia.shop/CHANEL-logo.png" loading="lazy" alt="CHANEL">
      </div>
      <div class="card-name">CHANEL</div>
    </a>
    <a class="brand-card" href="https://gallery.yjia.shop?brand=GUCCI" target="_blank" data-name="GUCCI">
      <div class="card-img-wrap">
        <img src="https://img.yjia.shop/gucci-logo.png" loading="lazy" alt="GUCCI">
      </div>
      <div class="card-name">GUCCI</div>
    </a>
    <a class="brand-card" href="https://gallery.yjia.shop?brand=LV" target="_blank" data-name="LV">
      <div class="card-img-wrap">
        <img src="https://img.yjia.shop/LV-logo.png" loading="lazy" alt="LV">
      </div>
      <div class="card-name">LV</div>
    </a>
    <!-- 👉 新增品牌直接复制上面a标签块，修改href参数、data-name、图片src、卡片文字 -->
  </div>

  <footer>
    Yingjia (Maoming) International Trade Co., Ltd<br>
    All pictures are for reference only, for wholesale inquiry.
  </footer>
</div>

<!-- WhatsApp悬浮按钮【修改这里号码！】 -->
<a class="wa-float" href="https://wa.me/8618566956446" target="_blank">💬</a>

<script>
const searchInput = document.getElementById("searchInput");
const cards = document.querySelectorAll(".brand-card");

searchInput.addEventListener("input", function(){
  const keyword = this.value.trim().toLowerCase();
  cards.forEach(card=>{
    const name = card.dataset.name.toLowerCase();
    if(name.includes(keyword)){
      card.style.display = "block";
    }else{
      card.style.display = "none";
    }
  })
})
</script>
</body>
</html>
