<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YJIA Shop</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background: #0a0a0a;
      color: #fff;
      padding: 30px 16px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    .header h1 {
      font-size: 32px;
      letter-spacing: 4px;
      color: #d4af37;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
    }
    .brand-card {
      background: #151515;
      border: 1px solid #2c2c2c;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: 0.3s ease;
    }
    .brand-card:hover {
      border-color: #d4af37;
      transform: translateY(-4px);
    }
    .card-img-wrap {
      height: 200px;
      overflow: hidden;
      background: #222;
    }
    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      loading: lazy;
    }
    .card-body {
      padding: 16px;
    }
    .brand-name {
      font-size: 18px;
      margin-bottom: 6px;
      color: #fff;
    }
    .brand-update-time {
      font-size: 12px;
      color: #888;
    }
    .wa-float {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 56px;
      height: 56px;
      background: #25D366;
      border-radius: 50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:28px;
      color:white;
      text-decoration:none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>YJIA SHOP</h1>
    </div>
    <div class="grid" id="brandGrid"></div>
  </div>
  <a class="wa-float" href="https://wa.me/你的whatsapp号码" target="_blank">💬</a>

<script>
// ========= API地址，改成你的Worker域名 =========
const API_BASE = "https://r2-api.yjia.shop";

// 品牌配置：r2Prefix = 这个品牌在R2里的文件夹路径
const brandList = [
  {
    name: "Brand A",
    cover: "https://r2-api.yjia.shop/yjia-img/brand-a-cover.jpg",
    link: "/gallery.html?brand=brandA&type=main",
    r2Prefix: "yjia-img/brandA/main/"
  },
  {
    name: "Brand B",
    cover: "https://r2-api.yjia.shop/yjia-img/brand-b-cover.jpg",
    link: "/gallery.html?brand=brandB&type=main",
    r2Prefix: "yjia-img/brandB/main/"
  },
  {
    name: "Brand C",
    cover: "https://r2-api.yjia.shop/yjia-img/brand-c-cover.jpg",
    link: "/gallery.html?brand=brandC&type=main",
    r2Prefix: "yjia-img/brandC/main/"
  }
];

const gridEl = document.getElementById("brandGrid");

brandList.forEach(item=>{
  const card = document.createElement('div');
  card.className = "brand-card";
  card.onclick = ()=> location.href = item.link;
  card.innerHTML = `
    <div class="card-img-wrap">
      <img src="${item.cover}" alt="${item.name}">
    </div>
    <div class="card-body">
      <div class="brand-name">${item.name}</div>
      <div class="brand-update-time" data-prefix="${item.r2Prefix}">Loading...</div>
    </div>
  `;
  gridEl.appendChild(card);

  // 异步请求最新时间，不阻塞页面渲染
  fetch(`${API_BASE}/lastmod?prefix=${encodeURIComponent(item.r2Prefix)}`)
  .then(res=>res.json())
  .then(ret=>{
    const dom = card.querySelector(".brand-update-time");
    if(!ret.latest){
      dom.textContent = "No files";
      return;
    }
    const d = new Date(ret.latest);
    // 格式化：YYYY-MM-DD
    const fmt = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    dom.textContent = `Updated: ${fmt}`;
  })
  .catch(()=>{
    card.querySelector(".brand-update-time").textContent = "Load fail";
  })
})
</script>
</body>
</html>
