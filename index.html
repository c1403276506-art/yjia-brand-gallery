<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Brand Collection</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}
body{
    padding: 40px 20px;
    text-align: center;
}
h1{
    font-size: 28px;
    color: #222;
    margin-bottom: 48px;
    font-weight: 500;
}
.container{
    display: flex;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
}
.card{
    width: 200px;
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    cursor: pointer;
    transition: transform 0.25s ease;
    text-decoration: none;
}
.card:hover{
    transform: translateY(-6px);
}
.card-img-wrap{
    height: 180px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#ffffff;
}
.card-img-wrap img{
    max-width:75%;
    max-height:75%;
    object-fit: contain;
}
.card-name{
    padding:12px;
    font-size:17px;
    color:#222;
}
</style>
</head>
<body>
    <h1>Our Brand Collection</h1>
    <div class="container">
        <a class="card" href="https://gallery.yjia.shop/?prefix=dior/">
            <div class="card-img-wrap">
                <img src="https://img.yjia.shop/dior-logo.png" alt="Dior">
            </div>
            <div class="card-name">Dior</div>
        </a>
        <a class="card" href="https://gallery.yjia.shop/?prefix=chanel/">
            <div class="card-img-wrap">
                <img src="https://img.yjia.shop/chanel-logo.png" alt="Chanel">
            </div>
            <div class="card-name">Chanel</div>
        </a>
        <a class="card" href="https://gallery.yjia.shop/?prefix=lv/">
            <div class="card-img-wrap">
                <img src="https://img.yjia.shop/lv-logo.png" alt="LV">
            </div>
            <div class="card-name">LV</div>
        </a>
    </div>
</body>
</html>
