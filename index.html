*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{background:#f8f8f8;padding:40px 20px}
h1{text-align:center;margin-bottom:40px;color:#222;font-weight:500}
.brand-wrap{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:24px}
.brand-card{background:#fff;border-radius:16px;overflow:hidden;text-decoration:none;color:#222;transition:0.25s ease;box-shadow:0 2px 10px #0000000a}
.brand-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px #00000015}
.brand-img{width:100%;height:160px;object-fit:contain;padding:16px;background:#fff}
.brand-name{padding:14px;text-align:center;font-size:17px;font-weight:500}
</style>
