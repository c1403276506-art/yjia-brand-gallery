<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
body{
  min-height:100vh;
  padding:40px 16px 100px;
  color:#fff;
  position:relative;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.08), transparent 45%),
    radial-gradient(circle at 80% 10%, rgba(212, 175, 55, 0.12), transparent 50%),
    radial-gradient(circle at 50% 90%, rgba(255, 255, 255, 0.05), transparent 40%),
    linear-gradient(135deg, #1a1a1a 0%, #2b2419 35%, #141414 100%);
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 15% 25%, rgba(255,255,255,0.06) 1px, transparent 1.5px),
    radial-gradient(circle at 85% 35%, rgba(212,175,55,0.05) 1px, transparent 1.5px),
    radial-gradient(circle at 45% 80%, rgba(255,255,255,0.04) 1px, transparent 1.5px);
  background-size:120px 120px, 180px 180px, 160px 160px;
  pointer-events:none;
  z-index:0;
}
.container{
  max-width:1200px;
  margin:0 auto;
  position:relative;
  z-index:1;
}
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:24px;
  gap:16px;
}
.page-title{
  font-size:28px;
  letter-spacing:3px;
  font-weight:500;
  color:#f5f5f5;
}
.back-home{
  padding:10px 20px;
  border:1px solid rgba(212,175,55,0.45);
  color:#d4af37;
  text-decoration:none;
  border-radius:999px;
  font-size:14px;
  letter-spacing:1px;
  transition:0.3s;
  background:rgba(212,175,55,0.06);
}
.back-home:hover{
  background:rgba(212,175,55,0.2);
}
.pagination-bar{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin:28px 0;
}
.pagination-bar button{
  padding:9px 20px;
  border:1px solid rgba(212,175,55,0.45);
  color:#d4af37;
  background:rgba(212,175,55,0.06);
  border-radius:999px;
  font-size:14px;
  cursor:pointer;
  transition:0.25s;
}
.pagination-bar button:disabled{
  opacity:0.35;
  cursor:not-allowed;
}
.pagination-bar button:not(:disabled):hover{
  background:rgba(212,175,55,0.2);
}
.page-info{
  color:#ccc;
  font-size:14px;
}
.image-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
  gap:24px;
}
.img-card{
  background:linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
  border:1px solid rgba(255,255,255,0.12);
  border-radius:18px;
  overflow:hidden;
  position:relative;
  transition:0.35s ease;
}
.img-card:hover{
  transform:translateY(-6px);
  border-color:rgba(212,175,55,0.45);
  box-shadow:0 16px 32px rgba(0,0,0,0.4);
}
.img-wrap{
  width:100%;
  aspect-ratio:1/1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  background:rgba(255,255,255,0.04);
  cursor:zoom-in;
}
.img-wrap img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}
.wa-btn{
  width:100%;
  border:none;
  padding:12px;
  background:#25D366;
  color:#fff;
  font-size:14px;
  cursor:pointer;
  transition:0.25s;
}
.wa-btn:hover{
  background:#1fbb59;
}
.loading{
  text-align:center;
  padding:60px;
  color:#b8b8b8;
  letter-spacing:2px;
}
.preview-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.94);
  z-index:999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  overflow:hidden;
}
.preview-modal.active{
  display:flex;
}
.preview-zoom-wrap{
  width:100%;
  height:100%;
  cursor:grab;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}
.preview-zoom-wrap:active{
  cursor:grabbing;
}
.preview-img{
  max-width:100%;
  max-height:94vh;
  object-fit:contain;
  transition:transform 0.08s ease-out;
  image-rendering: -moz-crisp-edges;
  image-rendering: -webkit-optimize-contrast;
  image-rendering: crisp-edges;
}
.preview-close{
  position:absolute;
  top:20px;
  right:24px;
  color:#fff;
  font-size:36px;
  cursor:pointer;
  user-select:none;
  z-index:10;
}
.open-original-btn{
  position:absolute;
  top:26px;
  right:90px;
  z-index:10;
  padding:6px 12px;
  border:1px solid #d4af37;
  color:#d4af37;
  background:rgba(0,0,0,0.35);
  border-radius:8px;
  font-size:13px;
  text-decoration:none;
}
.open-original-btn:hover{
  background:rgba(212,175,55,0.25);
}
.zoom-tip{
  position:absolute;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  color:#ccc;
  font-size:13px;
  background:rgba(0,0,0,0.45);
  padding:6px 14px;
  border-radius:99px;
  pointer-events:none;
}
@media(max-width:768px){
  .header{
    flex-direction:column;
    align-items:flex-start;
  }
  .page-title{
    font-size:22px;
  }
  .image-grid{
    grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
    gap:16px;
  }
  .img-wrap{
    padding:12px;
  }
  .wa-btn{
    padding:10px;
    font-size:13px;
  }
  .preview-close{
    top:12px;
    right:16px;
    font-size:30px;
  }
  .open-original-btn{
    right:68px;
    top:16px;
    font-size:11px;
    padding:4px 8px;
  }
  .zoom-tip{
    display:none;
  }
  .pagination-bar{
    gap:8px;
  }
  .pagination-bar button{
    padding:7px 14px;
    font-size:13px;
  }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1 class="page-title" id="brandTitle">Loading...</h1>
    <a href="https://yjia.shop" class="back-home">BACK TO HOME</a>
  </div>
  <div id="loading" class="loading">Loading images...</div>
  <div class="image-grid" id="imageGrid"></div>
  <div class="pagination-bar" id="pagination" style="display:none;">
    <button id="btnPrev">Prev</button>
    <span class="page-info" id="pageInfo"></span>
    <button id="btnNext">Next</button>
  </div>
</div>
<div class="preview-modal" id="previewModal">
  <span class="preview-close" id="previewClose">&times;</span>
  <a href="" target="_blank" class="open-original-btn" id="openOriginalBtn">Open Original</a>
  <div class="preview-zoom-wrap" id="zoomWrap">
    <img class="preview-img" id="previewImg" src="" alt="preview">
  </div>
  <div class="zoom-tip">Scroll to zoom · Drag to move</div>
</div>
<script>
// =========配置区=========
const WA_PHONE = "8618566956446";
const WORKER_API = "https://r2-gallery-api-super-breeze-9997.c1403276506.workers.dev";
const PAGE_SIZE = 50;
// ========================
const urlParams = new URLSearchParams(location.search);
const brandPrefix = urlParams.get("brand");
const type = urlParams.get("type");
document.title = `${brandPrefix||""} - ${type||""}`;
document.getElementById("brandTitle").innerText = `${brandPrefix||""} / ${type||""}`;

const previewModal = document.getElementById("previewModal");
const previewImg = document.getElementById("previewImg");
const previewClose = document.getElementById("previewClose");
const zoomWrap = document.getElementById("zoomWrap");
const openOriginalBtn = document.getElementById("openOriginalBtn");
const gridEl = document.getElementById("imageGrid");
const loadingEl = document.getElementById("loading");
const paginationEl = document.getElementById("pagination");
const pageInfoEl = document.getElementById("pageInfo");
const btnPrev = document.getElementById("btnPrev");
const btnNext = document.getElementById("btnNext");

let currentPage = 1;
let hasMore = true;
let nextStartAfter = null;
// 缓存：key=pageNum，value={items, startAfter}
const pageCache = new Map();
// 标记是否正在请求，防止并发
let fetchLock = false;

let scale = 1;
let posX = 0;
let posY = 0;
let isDragging = false;
let startX = 0;
let startY = 0;
const MIN_SCALE = 1;
const MAX_SCALE = 4;
const SCALE_STEP = 0.12;

function resetZoom(){
  scale = 1;
  posX = 0;
  posY = 0;
  applyTransform();
}
function applyTransform(){
  previewImg.style.transform = `translate(${posX}px,${posY}px) scale(${scale})`;
}
previewClose.onclick = ()=>{
  previewModal.classList.remove("active");
  resetZoom();
};
previewModal.onclick = (e)=>{
  if(e.target === previewModal) {
    previewModal.classList.remove("active");
    resetZoom();
  }
};
document.addEventListener("keydown", (e)=>{
  if(e.key === "Escape"){
    previewModal.classList.remove("active");
    resetZoom();
  }
});
zoomWrap.addEventListener("wheel", (e)=>{
  e.preventDefault();
  const delta = e.deltaY < 0 ? SCALE_STEP : -SCALE_STEP;
  scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale + delta));
  applyTransform();
},{passive:false});
zoomWrap.addEventListener("mousedown", (e)=>{
  if(scale <= 1) return;
  isDragging = true;
  startX = e.clientX - posX;
  startY = e.clientY - posY;
});
document.addEventListener("mousemove", (e)=>{
  if(!isDragging) return;
  posX = e.clientX - startX;
  posY = e.clientY - startY;
  applyTransform();
});
document.addEventListener("mouseup", ()=> isDragging = false);

// 请求一页数据（游标分页）
async function fetchPage(pageNum){
  if(pageCache.has(pageNum)) return pageCache.get(pageNum);
  if(fetchLock) return null;
  fetchLock = true;
  let sa = null;
  // 拿到上一页的游标
  if(pageCache.has(pageNum -1)){
    sa = pageCache.get(pageNum -1).startAfter;
  }
  const q = new URLSearchParams();
  q.set("brand", brandPrefix);
  q.set("type", type);
  q.set("limit", PAGE_SIZE);
  if(sa) q.set("startAfter", sa);
  const res = await fetch(`${WORKER_API}?${q.toString()}`);
  const json = await res.json();
  const data = {
    items: json.items,
    startAfter: json.nextStartAfter,
    hasMore: json.hasMore
  };
  pageCache.set(pageNum, data);
  fetchLock = false;
  return data;
}

// 预加载：只预加载下一页
async function preloadNextPage(pageNum){
  if(!hasMore || pageCache.has(pageNum + 1)) return;
  const data = await fetchPage(pageNum + 1);
  if(!data) return;
  // 静默预加载图片
  data.items.forEach(item=>{
    const img = new Image();
    img.src = `${WORKER_API}/${item.key}`;
  })
}

async function renderPage(page){
  loadingEl.style.display = "block";
  gridEl.innerHTML = "";
  const pageData = await fetchPage(page);
  if(!pageData) return;
  loadingEl.style.display = "none";
  const { items } = pageData;
  if(items.length === 0){
    loadingEl.innerText = "No images";
    paginationEl.style.display = "none";
    return;
  }
  items.forEach(item=>{
    const rawUrl = `${WORKER_API}/${item.key}`;
    const card = document.createElement("div");
    card.className = "img-card";
    card.innerHTML = `
      <div class="img-wrap" data-full="${rawUrl}">
        <img src="${rawUrl}" loading="lazy" decoding="async" onerror="this.style.opacity='0.25'">
      </div>
      <button class="wa-btn" data-link="${rawUrl}" data-brand="${brandPrefix}">Inquire via WhatsApp</button>
    `;
    gridEl.appendChild(card);
  })
  document.querySelectorAll(".img-wrap").forEach(wrap=>{
    wrap.onclick = function(){
      const fullSrc = this.dataset.full;
      previewImg.src = fullSrc;
      openOriginalBtn.href = fullSrc;
      resetZoom();
      previewModal.classList.add("active");
    }
  })
  document.querySelectorAll(".wa-btn").forEach(btn=>{
    btn.onclick = function(e){
      e.stopPropagation();
      const picLink = this.dataset.link;
      const brandName = this.dataset.brand;
      const msg = encodeURIComponent(`Hello, I'm interested in this item【${brandName}】\nImage link: ${picLink}`);
      window.open(`https://wa.me/${WA_PHONE}?text=${msg}`,"_blank");
    }
  })
  // 更新分页UI
  pageInfoEl.innerText = `Page ${page}`;
  btnPrev.disabled = page <= 1;
  btnNext.disabled = !pageData.hasMore;
  paginationEl.style.display = "flex";
  hasMore = pageData.hasMore;
  // 渲染完成，延迟预加载下一页
  setTimeout(()=> preloadNextPage(page), 500);
}

btnPrev.onclick = async ()=>{
  if(currentPage > 1){
    currentPage--;
    await renderPage(currentPage);
  }
}
btnNext.onclick = async ()=>{
  if(hasMore){
    currentPage++;
    await renderPage(currentPage);
  }
}

(async function init(){
  if(!brandPrefix || !type){
    loadingEl.innerText = "Missing parameters! Example: ?brand=GUCCI&type=jewelry";
    return;
  }
  await renderPage(currentPage);
})()
</script>
</body>
</html>
