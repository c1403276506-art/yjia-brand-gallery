<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brand Product Gallery</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f8f8f8;padding:30px;max-width:1200px;margin:0 auto}
h1{text-align:center;color:#333;margin-bottom:40px;font-size:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:26px}
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #00000015;text-decoration:none;color:#222;display:block}
.card img{width:100%;height:190px;object-fit:cover}
.card .name{padding:18px;text-align:center;font-size:20px;font-weight:bold}
</style>
</head>
<body>
<h1>Our Brand Collection</h1>
<div class="grid">
<a class="card" href="list.html?dir=dior">
<img src="https://img.yjia.shop/dior/cover.jpg" alt="Dior">
<div class="name">Dior</div>
</a>
<a class="card" href="list.html?dir=chanel">
<img src="https://img.yjia.shop/chanel/cover.jpg" alt="Chanel">
<div class="name">Chanel</div>
</a>
<a class="card" href="list.html?dir=lv">
<img src="https://img.yjia.shop/lv/cover.jpg" alt="LV">
<div class="name">LV</div>
</a>
</div>
</body>
</html>
